<svg xmlns="http://www.w3.org/2000/svg" width="382" height="40" viewBox="0 0 382 40" font-family="ui-monospace, SFMono-Regular, Consolas, 'DejaVu Sans Mono', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
