 <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950" stop-opacity=".9"/><stop offset="1" stop-color="#30363d"/></linearGradient>
</defs>
<rect x=".75" y=".75" width="380.5" height="38.5" rx="10" fill="url(#g)" stroke="url(#b)" stroke-width="1.5"/>
<circle class="pulse" cx="25" cy="20" r="5" fill="#3fb950"/><circle cx="25" cy="20" r="5" fill="#3fb950"/>
